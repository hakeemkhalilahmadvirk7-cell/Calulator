
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بہترین ملٹی کیلکولیٹر اور صحت کا مرکز</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f766e, #0d9488);
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #0f766e;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: #cbd5e1;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
            color: #334155;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
        }

        /* Calculator Container with Frame */
        .calculator-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #14b8a6;
            box-shadow: 0 15px 35px rgba(15, 118, 110, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            display: none;
        }

        .calculator-container.active {
            display: block;
        }

        /* Display */
        .display {
            width: 100%;
            height: 65px;
            background: #f8fafc;
            border: 2px solid #94a3b8;
            border-radius: 12px;
            font-size: 1.8rem;
            text-align: left;
            padding: 0 15px;
            margin-bottom: 20px;
            color: #0f172a;
            direction: ltr;
        }

        /* Keypads */
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button.calc-btn {
            border: none;
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button.calc-btn:active {
            transform: scale(0.95);
        }

        button.num-btn {
            background: #e2e8f0;
            color: #1e293b;
        }
        button.num-btn:hover {
            background: #cbd5e1;
        }

        button.operator {
            background: #99f6e4;
            color: #0f766e;
        }
        button.operator:hover {
            background: #5eead4;
        }

        button.action-clear {
            background: #fecaca;
            color: #b91c1c;
        }
        button.action-clear:hover {
            background: #fca5a5;
        }

        button.equals {
            background: var(--primary-gradient);
            color: white;
            grid-column: span 2;
        }

        .wide {
            grid-column: span 2;
        }

        /* BMI Styling */
        .bmi-group {
            margin-bottom: 15px;
        }

        .bmi-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #334155;
        }

        .bmi-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            direction: ltr;
        }

        .bmi-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* گول گراف (Gauge Meter Style) */
        .gauge-container {
            position: relative;
            width: 260px;
            height: 135px;
            margin: 20px auto 10px auto;
            overflow: hidden;
            display: none;
        }

        .gauge-arc {
            width: 260px;
            height: 130px;
            border-top-left-radius: 130px;
            border-top-right-radius: 130px;
            background: conic-gradient(
                from 180deg at 50% 100%,
                #b91c1c 0deg,   /* Obese / Red */
                #f59e0b 45deg,  /* Overweight / Yellow */
                #10b981 90deg,  /* Normal / Green */
                #3b82f6 135deg, /* Underweight / Blue */
                #b91c1c 180deg
            );
            position: absolute;
            top: 0;
            left: 0;
        }

        .gauge-cover {
            width: 200px;
            height: 100px;
            background: #ffffff;
            border-top-left-radius: 100px;
            border-top-right-radius: 100px;
            position: absolute;
            bottom: 0;
            left: 30px;
        }

        .gauge-needle {
            width: 4px;
            height: 110px;
            background: #1e293b;
            position: absolute;
            bottom: 0;
            left: 128px;
            transform-origin: bottom center;
            transform: rotate(-90deg);
            transition: transform 1s ease-in-out;
            border-radius: 2px;
        }

        .gauge-needle::after {
            content: '';
            width: 14px;
            height: 14px;
            background: #0f766e;
            position: absolute;
            bottom: -7px;
            left: -5px;
            border-radius: 50%;
        }

        .bmi-mini-result {
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #0f766e;
            margin-top: 10px;
            display: none;
        }

        /* نیا تفصیلی صفحہ (Modal Popup) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: right;
            direction: rtl;
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal-content h2 {
            color: #0f766e;
            margin-bottom: 15px;
            border-bottom: 2px solid #14b8a6;
            padding-bottom: 8px;
        }

        .modal-body {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #334155;
            margin-bottom: 20px;
        }

        .close-modal-btn {
            background: #e11d48;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>حساب کتاب اور صحت کا مرکز</h1>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('simple', this)">سادہ کیلکولیٹر</button>
        <button class="tab-btn" onclick="switchTab('scientific', this)">سائنسی کیلکولیٹر</button>
        <button class="tab-btn" onclick="switchTab('bmi', this)">BMI کیلکولیٹر</button>
    </div>

    <!-- 1. Simple Calculator -->
    <div id="simple" class="calculator-container active">
        <input type="text" id="simple-display" class="display" readonly value="0" />
        <div class="keys">
            <button class="calc-btn action-clear" onclick="clearDisplay('simple')">C</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '(')">(</button>
            <button class="calc-btn operator" onclick="appendValue('simple', ')')">)</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '/')">÷</button>
            
            <button class="calc-btn num-btn" onclick="appendValue('simple', '7')">7</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '8')">8</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '9')">9</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '*')">×</button>
            
            <button class="calc-btn num-btn" onclick="appendValue('simple', '4')">4</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '5')">5</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '6')">6</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '-')">-</button>
            
            <button class="calc-btn num-btn" onclick="appendValue('simple', '1')">1</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '2')">2</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '3')">3</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '+')">+</button>
            
            <button class="calc-btn num-btn wide" onclick="appendValue('simple', '0')">0</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '.')">.</button>
            <button class="calc-btn equals" onclick="calculate('simple')">=</button>
        </div>
    </div>

    <!-- 2. Scientific Calculator -->
    <div id="scientific" class="calculator-container">
        <input type="text" id="scientific-display" class="display" readonly value="0" />
        <div class="keys">
            <button class="calc-btn action-clear" onclick="clearDisplay('scientific')">C</button>
            <button class="calc-btn operator" onclick="sciFunc('Math.sin')">sin</button>
            <button class="calc-btn operator" onclick="sciFunc('Math.cos')">cos</button>
            <button class="calc-btn operator" onclick="appendValue('scientific', '/')">÷</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.tan')">tan</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '7')">7</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '8')">8</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '9')">9</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.sqrt')">√</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '4')">4</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '5')">5</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '6')">6</button>
            
            <button class="calc-btn operator" onclick="appendValue('scientific', '**')">x^y</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '1')">1</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '2')">2</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '3')">3</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.log')">log</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '0')">0</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '.')">.</button>
            <button class="calc-btn equals" onclick="calculate('scientific')">=</button>
        </div>
    </div>

    <!-- 3. BMI Calculator with Inches & Gauge Graph -->
    <div id="bmi" class="calculator-container">
        <div class="bmi-group">
            <label>وزن (کلوگرام میں):</label>
            <input type="number" id="bmi-weight" placeholder="مثلاً: 75">
        </div>
        <div class="bmi-group">
            <label>قد (کل انچ میں، مثلاً 5 فٹ 6 انچ = 66 انچ):</label>
            <input type="number" id="bmi-height-inch" placeholder="مثلاً: 66">
        </div>
        <button class="bmi-btn" onclick="calculateBMI()">BMI اور تفصیلی رپورٹ دیکھیں</button>
        
        <!-- سکرین شاٹ جیسی گول سوئی والا گراف -->
        <div id="gauge-box" class="gauge-container">
            <div class="gauge-arc"></div>
            <div class="gauge-cover"></div>
            <div id="gauge-needle" class="gauge-needle"></div>
        </div>
        <div id="bmi-mini-text" class="bmi-mini-result"></div>
    </div>

    <!-- نیا تفصیلی صفحہ (Popup Modal) -->
    <div id="bmi-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>صحت اور وزنی رپورٹ</h2>
            <div id="modal-body-text" class="modal-body"></div>
            <button class="close-modal-btn" onclick="closeModal()">بند کریں</button>
        </div>
    </div>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.calculator-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function appendValue(type, val) {
            let display = document.getElementById(type + '-display');
            if (display.value === '0' || display.value === 'نتیجہ غلط') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearDisplay(type) {
            document.getElementById(type + '-display').value = '0';
        }

        function calculate(type) {
            let display = document.getElementById(type + '-display');
            try {
                let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                display.value = eval(expression);
            } catch (error) {
                display.value = 'نتیجہ غلط';
            }
        }

        function sciFunc(funcName) {
            let display = document.getElementById('scientific-display');
            try {
                let val = parseFloat(display.value);
                if (isNaN(val)) val = 0;
                
                if (funcName === 'Math.sqrt') display.value = Math.sqrt(val);
                else if (funcName === 'Math.sin') display.value = Math.sin(val);
                else if (funcName === 'Math.cos') display.value = Math.cos(val);
                else if (funcName === 'Math.tan') display.value = Math.tan(val);
                else if (funcName === 'Math.log') display.value = Math.log10(val);
            } catch (error) {
                display.value = 'نتیجہ غلط';
            }
        }

        function calculateBMI() {
            let weight = parseFloat(document.getElementById('bmi-weight').value);
            let heightInches = parseFloat(document.getElementById('bmi-height-inch').value);
            
            if (!weight || !heightInches || weight <= 0 || heightInches <= 10) {
                alert('براہ کرم وزن اور قد (انچ میں) درست درج کریں!');
                return;
            }

            // انچ کو میٹر میں تبدیل کرنا (1 انچ = 0.0254 میٹر)
            let heightMeters = heightInches * 0.0254;
            let bmi = (weight / (heightMeters * heightMeters)).toFixed(1);

            // آئیڈیل وزن کا حساب (BMI 22 کے مطابق)
            let idealWeight = 22 * (heightMeters * heightMeters);
            let weightDiff = Math.abs(weight - idealWeight).toFixed(1);

            let status = '';
            let detailsText = '';
            let needleAngle = -90; // Default

            // BMI کی حدود اور سوئی کی گردش (-90deg سے +90deg تک)
            if (bmi < 18.5) {
                status = 'دبلا پن (Underweight)';
                // -90deg (بائیں طرف) سے -45deg تک
                needleAngle = -90 + (bmi / 18.5) * 45;
                detailsText = `آپ کا وزن قد کے لحاظ سے کم ہے۔ آپ دبلے پن کا شکار ہیں۔<br><br>صحت مند اور متوازن وزن تک پہنچنے کے لیے آپ کو تقریباََ <strong>${weightDiff} کلوگرام وزن بڑھانا (خوراک بہتر کرنی) چاہیے</strong>۔`;
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                status = 'صحت مند وزن (Normal)';
                // -45deg سے +15deg (سبز حصہ)
                needleAngle = -20 + ((bmi - 18.5) / 6.4) * 35;
                detailsText = `مبارک ہو! آپ کا وزن بالکل متوازن اور صحت مند ہے۔<br><br>آپ کو وزن گھٹانے یا بڑھانے کی ضرورت نہیں ہے، بس اپنی صحت کو ایسے ہی برقرار رکھیں۔`;
            } else if (bmi >= 25 && bmi <= 29.9) {
                status = 'زیادہ وزن (Overweight)';
                // +15deg سے +55deg (پیلا حصہ)
                needleAngle = +20 + ((bmi - 25) / 4.9) * 35;
                detailsText = `آپ کا وزن صحت مند حد سے کچھ زیادہ ہے (Overweight)۔<br><br>صحت مند وزن میں واپس آنے کے لیے آپ کو اپنے وزن میں تقریباََ <strong>${weightDiff} کلوگرام کمی</strong> کرنا ہوگی۔`;
            } else {
                status = 'موٹاپا (Obese)';
                // +55deg سے +90deg (سرخ حصہ)
                needleAngle = +60 + Math.min(((bmi - 30) / 10) * 30, 30);
                detailsText = `آپ موٹاپے (Obesity) کا شکار ہیں جو صحت کے لیے خطرناک ہو سکتا ہے۔<br><br>خطرہ کم کرنے اور صحت مند زندگی کی طرف لوٹنے کے لیے آپ کو فوری طور پر تقریباََ <strong>${weightDiff} کلوگرام وزن کم کرنے</strong> کی ضرورت ہے۔`;
            }

            // چھوٹے ڈیش بورڈ پر گراف اور نتیجہ دکھائیں
            document.getElementById('gauge-box').style.display = 'block';
            document.getElementById('gauge-needle.style' || 'gauge-needle').style.transform = `rotate(${needleAngle}deg)`;
            
            let miniText = document.getElementById('bmi-mini-text');
            miniText.style.display = 'block';
            miniText.innerHTML = `BMI: ${bmi} — کیفیت: ${status}`;

            // نیا تفصیلی صفحہ (Modal) کھولیں
            document.getElementById('modal-body-text').innerHTML = `
                آپ کا BMI اسکور: <strong>${bmi}</strong><br>
                طبی کیفیت: <strong style="color: #0f766e;">${status}</strong><br><br>
                ${detailsText}
            `;
            document.getElementById('bmi-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('bmi-modal').style.display = 'none';
        }
    </script>
</body>
</html>
