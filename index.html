
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بہترین ملٹی کیلکولیٹر ڈیش بورڈ</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f766e, #0d9488);
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #0f766e;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: #cbd5e1;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
            color: #334155;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
        }

        /* Calculator Container with Frame/Border */
        .calculator-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            /* حاشیہ اور خوبصورت فریم */
            border: 4px solid #14b8a6;
            box-shadow: 0 15px 35px rgba(15, 118, 110, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            display: none;
        }

        .calculator-container.active {
            display: block;
        }

        /* Display */
        .display {
            width: 100%;
            height: 65px;
            background: #f8fafc;
            border: 2px solid #94a3b8;
            border-radius: 12px;
            font-size: 1.8rem;
            text-align: left;
            padding: 0 15px;
            margin-bottom: 20px;
            color: #0f172a;
            direction: ltr;
        }

        /* Keypads */
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button.calc-btn {
            border: none;
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button.calc-btn:active {
            transform: scale(0.95);
        }

        /* مختلف رنگوں والے بٹنز */
        /* نمبرز والے بٹنز (ہلکا نیلا/سرمئی) */
        button.num-btn {
            background: #e2e8f0;
            color: #1e293b;
        }
        button.num-btn:hover {
            background: #cbd5e1;
        }

        /* آپریٹرز (+, -, *, /) (خوبصورت سبز ٹೋನ್) */
        button.operator {
            background: #99f6e4;
            color: #0f766e;
        }
        button.operator:hover {
            background: #5eead4;
        }

        /* کلیئر بٹن (C) (ہلکا سرخ) */
        button.action-clear {
            background: #fecaca;
            color: #b91c1c;
        }
        button.action-clear:hover {
            background: #fca5a5;
        }

        /* برابر (=) بٹن */
        button.equals {
            background: var(--primary-gradient);
            color: white;
            grid-column: span 2;
        }

        .wide {
            grid-column: span 2;
        }

        /* BMI Styling */
        .bmi-group {
            margin-bottom: 15px;
        }

        .bmi-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #334155;
        }

        .bmi-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            direction: ltr;
        }

        .bmi-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .bmi-result {
            margin-top: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f766e;
        }

        /* گراف اور ویژول بار سٹائل */
        .bmi-graph-container {
            margin-top: 15px;
            background: #e2e8f0;
            border-radius: 10px;
            height: 24px;
            width: 100%;
            overflow: hidden;
            position: relative;
            display: none;
            border: 1px solid #cbd5e1;
        }

        .bmi-bar {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out, background-color 0.5s;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>حساب کتاب اور صحت کا مرکز</h1>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('simple', this)">سادہ کیلکولیٹر</button>
        <button class="tab-btn" onclick="switchTab('scientific', this)">سائنسی کیلکولیٹر</button>
        <button class="tab-btn" onclick="switchTab('bmi', this)">BMI کیلکولیٹر</button>
    </div>

    <!-- 1. Simple Calculator -->
    <div id="simple" class="calculator-container active">
        <input type="text" id="simple-display" class="display" readonly value="0" />
        <div class="keys">
            <button class="calc-btn action-clear" onclick="clearDisplay('simple')">C</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '(')">(</button>
            <button class="calc-btn operator" onclick="appendValue('simple', ')')">)</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '/')">÷</button>
            
            <button class="calc-btn num-btn" onclick="appendValue('simple', '7')">7</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '8')">8</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '9')">9</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '*')">×</button>
            
            <button class="calc-btn num-btn" onclick="appendValue('simple', '4')">4</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '5')">5</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '6')">6</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '-')">-</button>
            
            <button class="calc-btn num-btn" onclick="appendValue('simple', '1')">1</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '2')">2</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '3')">3</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '+')">+</button>
            
            <button class="calc-btn num-btn wide" onclick="appendValue('simple', '0')">0</button>
            <button class="calc-btn num-btn" onclick="appendValue('simple', '.')">.</button>
            <button class="calc-btn equals" onclick="calculate('simple')">=</button>
        </div>
    </div>

    <!-- 2. Scientific Calculator -->
    <div id="scientific" class="calculator-container">
        <input type="text" id="scientific-display" class="display" readonly value="0" />
        <div class="keys">
            <button class="calc-btn action-clear" onclick="clearDisplay('scientific')">C</button>
            <button class="calc-btn operator" onclick="sciFunc('Math.sin')">sin</button>
            <button class="calc-btn operator" onclick="sciFunc('Math.cos')">cos</button>
            <button class="calc-btn operator" onclick="appendValue('scientific', '/')">÷</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.tan')">tan</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '7')">7</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '8')">8</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '9')">9</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.sqrt')">√</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '4')">4</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '5')">5</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '6')">6</button>
            
            <button class="calc-btn operator" onclick="appendValue('scientific', '**')">x^y</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '1')">1</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '2')">2</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '3')">3</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.log')">log</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '0')">0</button>
            <button class="calc-btn num-btn" onclick="appendValue('scientific', '.')">.</button>
            <button class="calc-btn equals" onclick="calculate('scientific')">=</button>
        </div>
    </div>

    <!-- 3. BMI Calculator with Graph -->
    <div id="bmi" class="calculator-container">
        <div class="bmi-group">
            <label>وزن (کلوگرام میں):</label>
            <input type="number" id="bmi-weight" placeholder="مثلاً: 70">
        </div>
        <div class="bmi-group">
            <label>قد (سینٹی میٹر میں):</label>
            <input type="number" id="bmi-height" placeholder="مثلاً: 175">
        </div>
        <button class="bmi-btn" onclick="calculateBMI()">BMI اور گراف معلوم کریں</button>
        
        <div id="bmi-output" class="bmi-result"></div>
        
        <!-- ویژول گراف بار -->
        <div id="bmi-graph-box" class="bmi-graph-container">
            <div id="bmi-bar" class="bmi-bar"></div>
        </div>
    </div>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.calculator-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function appendValue(type, val) {
            let display = document.getElementById(type + '-display');
            if (display.value === '0' || display.value === 'نتیجہ غلط') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearDisplay(type) {
            document.getElementById(type + '-display').value = '0';
        }

        function calculate(type) {
            let display = document.getElementById(type + '-display');
            try {
                let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                display.value = eval(expression);
            } catch (error) {
                display.value = 'نتیجہ غلط';
            }
        }

        function sciFunc(funcName) {
            let display = document.getElementById('scientific-display');
            try {
                let val = parseFloat(display.value);
                if (isNaN(val)) val = 0;
                
                if (funcName === 'Math.sqrt') display.value = Math.sqrt(val);
                else if (funcName === 'Math.sin') display.value = Math.sin(val);
                else if (funcName === 'Math.cos') display.value = Math.cos(val);
                else if (funcName === 'Math.tan') display.value = Math.tan(val);
                else if (funcName === 'Math.log') display.value = Math.log10(val);
            } catch (error) {
                display.value = 'نتیجہ غلط';
            }
        }

        function calculateBMI() {
            let weight = parseFloat(document.getElementById('bmi-weight').value);
            let heightCm = parseFloat(document.getElementById('bmi-height').value);
            let output = document.getElementById('bmi-output');
            let graphBox = document.getElementById('bmi-graph-box');
            let bar = document.getElementById('bmi-bar');

            if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
                output.innerText = 'براہ کرم درست وزن اور قد درج کریں!';
                graphBox.style.display = 'none';
                return;
            }

            let heightM = heightCm / 100;
            let bmi = (weight / (heightM * heightM)).toFixed(1);
            let status = '';
            let barWidth = 0;
            let barColor = '';

            // کیٹیگری اور گراف کی ترتیب
            if (bmi < 18.5) {
                status = 'دبلا پن (Underweight)';
                barWidth = Math.min((bmi / 18.5) * 35, 35);
                barColor = '#3b82f6'; // نیلا رنگ (کم وزن)
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                status = 'صحت مند وزن (Normal)';
                barWidth = 50;
                barColor = '#10b981'; // سبز رنگ (نارمل)
            } else if (bmi >= 25 && bmi <= 29.9) {
                status = 'زیادہ وزن (Overweight)';
                barWidth = 75;
                barColor = '#f59e0b'; // پیلا/نارنجی رنگ (اوور ویٹ)
            } else {
                status = 'موٹاپا (Obese)';
                barWidth = 100;
                barColor = '#ef4444'; // سرخ رنگ (موٹاپا)
            }

            output.innerHTML = `آپ کا BMI: <strong>${bmi}</strong><br>کیفیت: <strong>${status}</strong>`;
            
            // گراف دکھائیں
            graphBox.style.display = 'block';
            bar.style.width = barWidth + '%';
            bar.style.backgroundColor = barColor;
        }
    </script>
</body>
</html>
