
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بہترین ملٹی کیلکولیٹر اور صحت کا مرکز</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f766e, #0d9488);
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        h1 {
            color: #0f766e;
            margin-bottom: 15px;
            font-size: 1.6rem;
            text-align: center;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            justify-content: center;
            width: 100%;
            max-width: 420px;
        }

        .tab-btn {
            flex: 1;
            background: #cbd5e1;
            border: none;
            padding: 10px 4px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.3s;
            color: #334155;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 8px rgba(13, 148, 136, 0.3);
        }

        /* Main View Container */
        #main-view {
            width: 100%;
            max-width: 420px;
        }

        .calculator-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #14b8a6;
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.12);
            width: 100%;
            display: none;
        }

        .calculator-container.active {
            display: block;
        }

        /* Display */
        .display {
            width: 100%;
            height: 60px;
            background: #f8fafc;
            border: 2px solid #94a3b8;
            border-radius: 12px;
            font-size: 1.8rem;
            text-align: left;
            padding: 0 15px;
            margin-bottom: 15px;
            color: #0f172a;
            direction: ltr;
        }

        /* Keypads */
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button.calc-btn {
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button.num-btn {
            background: #e2e8f0;
            color: #1e293b;
        }

        button.operator {
            background: #99f6e4;
            color: #0f766e;
        }

        button.action-clear {
            background: #fecaca;
            color: #b91c1c;
        }

        button.equals {
            background: var(--primary-gradient);
            color: white;
            grid-column: span 2;
        }

        .wide {
            grid-column: span 2;
        }

        /* BMI Inputs */
        .bmi-group {
            margin-bottom: 15px;
        }

        .bmi-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #334155;
            font-size: 0.95rem;
        }

        .bmi-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            direction: ltr;
        }

        .bmi-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        /* ----- SECOND PAGE (FULL REPORT VIEW) ----- */
        #report-view {
            display: none;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #14b8a6;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .back-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .report-header {
            color: #0f766e;
            border-bottom: 2px solid #14b8a6;
            padding-bottom: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.3rem;
        }

        /* Clean Gauge Meter (No text on top) */
        .gauge-wrapper {
            position: relative;
            width: 260px;
            height: 140px;
            margin: 15px auto 20px auto;
        }

        .gauge-body {
            width: 260px;
            height: 130px;
            border-top-left-radius: 130px;
            border-top-right-radius: 130px;
            background: conic-gradient(
                from 270deg at 50% 100%,
                #3b82f6 0deg 45deg,   /* Underweight - Blue */
                #10b981 45deg 90deg,  /* Normal - Green */
                #f59e0b 90deg 135deg, /* Overweight - Yellow */
                #ef4444 135deg 180deg /* Obese - Red */
            );
        }

        .gauge-inner {
            position: absolute;
            bottom: 0;
            left: 35px;
            width: 190px;
            height: 95px;
            background: #ffffff;
            border-top-left-radius: 95px;
            border-top-right-radius: 95px;
            text-align: center;
            padding-top: 35px;
        }

        .gauge-score-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            direction: ltr;
        }

        .gauge-needle-pin {
            position: absolute;
            bottom: -5px;
            left: 122px;
            width: 16px;
            height: 16px;
            background: #475569;
            border-radius: 50%;
            z-index: 10;
        }

        .gauge-needle-line {
            position: absolute;
            bottom: 3px;
            left: 128px;
            width: 4px;
            height: 95px;
            background: #0f172a;
            transform-origin: bottom center;
            transform: rotate(-90deg);
            transition: transform 1s ease-in-out;
            border-radius: 2px;
            z-index: 9;
        }

        .report-details {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>حساب کتاب اور صحت کا مرکز</h1>

    <!-- MAIN VIEW -->
    <div id="main-view">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('simple', this)">سادہ کیلکولیٹر</button>
            <button class="tab-btn" onclick="switchTab('scientific', this)">سائنسی کیلکولیٹر</button>
            <button class="tab-btn" onclick="switchTab('bmi', this)">BMI کیلکولیٹر</button>
        </div>

        <!-- 1. Simple Calculator -->
        <div id="simple" class="calculator-container active">
            <input type="text" id="simple-display" class="display" readonly value="0" />
            <div class="keys">
                <button class="calc-btn action-clear" onclick="clearDisplay('simple')">C</button>
                <button class="calc-btn operator" onclick="appendValue('simple', '(')">(</button>
                <button class="calc-btn operator" onclick="appendValue('simple', ')')">)</button>
                <button class="calc-btn operator" onclick="appendValue('simple', '/')">÷</button>
                
                <button class="calc-btn num-btn" onclick="appendValue('simple', '7')">7</button>
                <button class="calc-btn num-btn" onclick="appendValue('simple', '8')">8</button>
                <button class="calc-btn num-btn" onclick="appendValue('simple', '9')">9</button>
                <button class="calc-btn operator" onclick="appendValue('simple', '*')">×</button>
                
                <button class="calc-btn num-btn" onclick="appendValue('simple', '4')">4</button>
                <button class="calc-btn num-btn" onclick="appendValue('simple', '5')">5</button>
                <button class="calc-btn num-btn" onclick="appendValue('simple', '6')">6</button>
                <button class="calc-btn operator" onclick="appendValue('simple', '-')">-</button>
                
                <button class="calc-btn num-btn" onclick="appendValue('simple', '1')">1</button>
                <button class="calc-btn num-btn" onclick="appendValue('simple', '2')">2</button>
                <button class="calc-btn num-btn" onclick="appendValue('simple', '3')">3</button>
                <button class="calc-btn operator" onclick="appendValue('simple', '+')">+</button>
                
                <button class="calc-btn num-btn wide" onclick="appendValue('simple', '0')">0</button>
                <button class="calc-btn num-btn" onclick="appendValue('simple', '.')">.</button>
                <button class="calc-btn equals" onclick="calculate('simple')">=</button>
            </div>
        </div>

        <!-- 2. Scientific Calculator -->
        <div id="scientific" class="calculator-container">
            <input type="text" id="scientific-display" class="display" readonly value="0" />
            <div class="keys">
                <button class="calc-btn action-clear" onclick="clearDisplay('scientific')">C</button>
                <button class="calc-btn operator" onclick="sciFunc('Math.sin')">sin</button>
                <button class="calc-btn operator" onclick="sciFunc('Math.cos')">cos</button>
                <button class="calc-btn operator" onclick="appendValue('scientific', '/')">÷</button>
                
                <button class="calc-btn operator" onclick="sciFunc('Math.tan')">tan</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '7')">7</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '8')">8</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '9')">9</button>
                
                <button class="calc-btn operator" onclick="sciFunc('Math.sqrt')">√</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '4')">4</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '5')">5</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '6')">6</button>
                
                <button class="calc-btn operator" onclick="appendValue('scientific', '**')">x^y</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '1')">1</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '2')">2</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '3')">3</button>
                
                <button class="calc-btn operator" onclick="sciFunc('Math.log')">log</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '0')">0</button>
                <button class="calc-btn num-btn" onclick="appendValue('scientific', '.')">.</button>
                <button class="calc-btn equals" onclick="calculate('scientific')">=</button>
            </div>
        </div>

        <!-- 3. BMI Inputs -->
        <div id="bmi" class="calculator-container">
            <div class="bmi-group">
                <label>وزن (کلوگرام میں):</label>
                <input type="number" id="bmi-weight" placeholder="مثلاً: 75">
            </div>
            <div class="bmi-group">
                <label>قد (کل انچ میں، مثلاً 5 فٹ 6 انچ = 66 انچ):</label>
                <input type="number" id="bmi-height-inch" placeholder="مثلاً: 66">
            </div>
            <button class="bmi-btn" onclick="generateReport()">BMI اور تفصیلی رپورٹ دیکھیں</button>
        </div>
    </div>

    <!-- SECOND PAGE (Full Screen Report View) -->
    <div id="report-view">
        <button class="back-btn" onclick="showMainPage()">➔ واپس کیلکولیٹر پر جائیں</button>
        <h2 class="report-header">صحت اور BMI تفصیلی رپورٹ</h2>

        <!-- Gauge Meter (Clean without text overlays) -->
        <div class="gauge-wrapper">
            <div class="gauge-body"></div>
            <div class="gauge-inner">
                <div id="gauge-score-text" class="gauge-score-text">BMI = 0.0</div>
            </div>
            <div class="gauge-needle-pin"></div>
            <div id="gauge-needle-line" class="gauge-needle-line"></div>
        </div>

        <!-- Result Details -->
        <div id="report-text-details" class="report-details"></div>
    </div>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.calculator-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function appendValue(type, val) {
            let display = document.getElementById(type + '-display');
            if (display.value === '0' || display.value === 'نتیجہ غلط') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearDisplay(type) {
            document.getElementById(type + '-display').value = '0';
        }

        function calculate(type) {
            let display = document.getElementById(type + '-display');
            try {
                let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                display.value = eval(expression);
            } catch (error) {
                display.value = 'نتیجہ غلط';
            }
        }

        function sciFunc(funcName) {
            let display = document.getElementById('scientific-display');
            try {
                let val = parseFloat(display.value);
                if (isNaN(val)) val = 0;
                
                if (funcName === 'Math.sqrt') display.value = Math.sqrt(val);
                else if (funcName === 'Math.sin') display.value = Math.sin(val);
                else if (funcName === 'Math.cos') display.value = Math.cos(val);
                else if (funcName === 'Math.tan') display.value = Math.tan(val);
                else if (funcName === 'Math.log') display.value = Math.log10(val);
            } catch (error) {
                display.value = 'نتیجہ غلط';
            }
        }

        function generateReport() {
            let weight = parseFloat(document.getElementById('bmi-weight').value);
            let heightInches = parseFloat(document.getElementById('bmi-height-inch').value);
            
            if (!weight || !heightInches || weight <= 0 || heightInches <= 10) {
                alert('براہ کرم وزن اور قد (انچ میں) درست درج کریں!');
                return;
            }

            let heightMeters = heightInches * 0.0254;
            let bmi = (weight / (heightMeters * heightMeters)).toFixed(1);

            let idealWeight = 22 * (heightMeters * heightMeters);
            let weightDiff = Math.abs(weight - idealWeight).toFixed(1);

            let detailsText = '';
            let needleAngle = -90; 

            if (bmi < 18.5) {
                needleAngle = -90 + Math.min((bmi / 18.5) * 45, 45);
                detailsText = `آپ کا موجودہ وزن: <strong>${weight} کلوگرام</strong><br>تجویز کردہ متوازن وزن: <strong>${idealWeight.toFixed(1)} کلوگرام</strong><br><br>آپ کا وزن قد کے حساب سے کم ہے۔ متوازن اور صحت مند حد میں آنے کے لیے آپ کو تقریباََ <strong>${weightDiff} کلوگرام وزن بڑھانا</strong> چاہیے۔`;
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                needleAngle = -45 + ((bmi - 18.5) / 6.4) * 45;
                detailsText = `آپ کا موجودہ وزن: <strong>${weight} کلوگرام</strong><br>تجویز کردہ متوازن وزن: <strong>${idealWeight.toFixed(1)} کلوگرام</strong><br><br>مبارک ہو! آپ کا وزن بالکل متوازن اور صحت مند ہے۔ آپ کو وزن گھٹانے یا بڑھانے کی ضرورت نہیں ہے۔`;
            } else if (bmi >= 25 && bmi <= 29.9) {
                needleAngle = 0 + ((bmi - 25) / 4.9) * 45;
                detailsText = `آپ کا موجودہ وزن: <strong>${weight} کلوگرام</strong><br>تجویز کردہ متوازن وزن: <strong>${idealWeight.toFixed(1)} کلوگرام</strong><br><br>آپ کا وزن نارمل حد سے کچھ زیادہ ہے۔ صحت مند حد تک واپس آنے کے لیے آپ کو تقریباََ <strong>${weightDiff} کلوگرام وزن کم</strong> کرنا ہوگا۔`;
            } else {
                needleAngle = 45 + Math.min(((bmi - 30) / 15) * 45, 45);
                detailsText = `آپ کا موجودہ وزن: <strong>${weight} کلوگرام</strong><br>تجویز کردہ متوازن وزن: <strong>${idealWeight.toFixed(1)} کلوگرام</strong><br><br>آپ موٹاپے کا شکار ہیں جو صحت کے لیے نقصان دہ ہو سکتا ہے۔ صحت مند حد حاصل کرنے کے لیے آپ کو فوری طور پر <strong>${weightDiff} کلوگرام وزن کم کرنے</strong> کی ہدایت کی جاتی ہے۔`;
            }

            // Hide Main View, Show Report View
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('report-view').style.display = 'block';

            // Update Report Contents
            document.getElementById('gauge-score-text').innerText = `BMI = ${bmi}`;
            document.getElementById('report-text-details').innerHTML = detailsText;

            // Rotate Needle
            setTimeout(() => {
                document.getElementById('gauge-needle-line').style.transform = `rotate(${needleAngle}deg)`;
            }, 100);
        }

        function showMainPage() {
            document.getElementById('report-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }
    </script>
</body>
</html>
