<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بہترین ملٹی کیلکولیٹر ڈیش بورڈ</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f766e, #0d9488);
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #14b8a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #0f766e;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
            color: #475569;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
        }

        /* Calculator Container */
        .calculator-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            display: none;
        }

        .calculator-container.active {
            display: block;
        }

        /* Display */
        .display {
            width: 100%;
            height: 60px;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.6rem;
            text-align: left;
            padding: 0 15px;
            margin-bottom: 20px;
            color: #334155;
            direction: ltr;
        }

        /* Keypads */
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button.calc-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            color: #334155;
        }

        button.calc-btn:hover {
            background: #f1f5f9;
            border-color: var(--accent-color);
        }

        button.operator {
            background: #ccfbf1;
            color: #0f766e;
            border-color: #99f6e4;
        }

        button.action-clear {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        button.equals {
            background: var(--primary-gradient);
            color: white;
            grid-column: span 2;
        }

        .wide {
            grid-column: span 2;
        }

        /* BMI Styling */
        .bmi-group {
            margin-bottom: 15px;
        }

        .bmi-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #475569;
        }

        .bmi-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            direction: ltr;
        }

        .bmi-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .bmi-result {
            margin-top: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f766e;
        }
    </style>
</head>
<body>

    <h1>حساب کتاب اور صحت کا مرکز</h1>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('simple', this)">سادہ کیلکولیٹر</button>
        <button class="tab-btn" onclick="switchTab('scientific', this)">سائنسی کیلکولیٹر</button>
        <button class="tab-btn" onclick="switchTab('bmi', this)">BMI کیلکولیٹر</button>
    </div>

    <!-- 1. Simple Calculator -->
    <div id="simple" class="calculator-container active">
        <input type="text" id="simple-display" class="display" readonly value="0" />
        <div class="keys">
            <button class="calc-btn action-clear" onclick="clearDisplay('simple')">C</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '(')">(</button>
            <button class="calc-btn operator" onclick="appendValue('simple', ')')">)</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '/')">÷</button>
            
            <button class="calc-btn" onclick="appendValue('simple', '7')">7</button>
            <button class="calc-btn" onclick="appendValue('simple', '8')">8</button>
            <button class="calc-btn" onclick="appendValue('simple', '9')">9</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '*')">×</button>
            
            <button class="calc-btn" onclick="appendValue('simple', '4')">4</button>
            <button class="calc-btn" onclick="appendValue('simple', '5')">5</button>
            <button class="calc-btn" onclick="appendValue('simple', '6')">6</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '-')">-</button>
            
            <button class="calc-btn" onclick="appendValue('simple', '1')">1</button>
            <button class="calc-btn" onclick="appendValue('simple', '2')">2</button>
            <button class="calc-btn" onclick="appendValue('simple', '3')">3</button>
            <button class="calc-btn operator" onclick="appendValue('simple', '+')">+</button>
            
            <button class="calc-btn wide" onclick="appendValue('simple', '0')">0</button>
            <button class="calc-btn" onclick="appendValue('simple', '.')">.</button>
            <button class="calc-btn equals" onclick="calculate('simple')">=</button>
        </div>
    </div>

    <!-- 2. Scientific Calculator -->
    <div id="scientific" class="calculator-container">
        <input type="text" id="scientific-display" class="display" readonly value="0" />
        <div class="keys">
            <button class="calc-btn action-clear" onclick="clearDisplay('scientific')">C</button>
            <button class="calc-btn operator" onclick="sciFunc('Math.sin')">sin</button>
            <button class="calc-btn operator" onclick="sciFunc('Math.cos')">cos</button>
            <button class="calc-btn operator" onclick="appendValue('scientific', '/')">÷</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.tan')">tan</button>
            <button class="calc-btn" onclick="appendValue('scientific', '7')">7</button>
            <button class="calc-btn" onclick="appendValue('scientific', '8')">8</button>
            <button class="calc-btn" onclick="appendValue('scientific', '9')">9</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.sqrt')">√</button>
            <button class="calc-btn" onclick="appendValue('scientific', '4')">4</button>
            <button class="calc-btn" onclick="appendValue('scientific', '5')">5</button>
            <button class="calc-btn" onclick="appendValue('scientific', '6')">6</button>
            
            <button class="calc-btn operator" onclick="appendValue('scientific', '**')">x^y</button>
            <button class="calc-btn" onclick="appendValue('scientific', '1')">1</button>
            <button class="calc-btn" onclick="appendValue('scientific', '2')">2</button>
            <button class="calc-btn" onclick="appendValue('scientific', '3')">3</button>
            
            <button class="calc-btn operator" onclick="sciFunc('Math.log')">log</button>
            <button class="calc-btn" onclick="appendValue('scientific', '0')">0</button>
            <button class="calc-btn" onclick="appendValue('scientific', '.')">.</button>
            <button class="calc-btn equals" onclick="calculate('scientific')">=</button>
        </div>
    </div>

    <!-- 3. BMI Calculator -->
    <div id="bmi" class="calculator-container">
        <div class="bmi-group">
            <label>وزن (کلوگرام میں):</label>
            <input type="number" id="bmi-weight" placeholder="مثلاً: 70">
        </div>
        <div class="bmi-group">
            <label>قد (سینٹی میٹر میں):</label>
            <input type="number" id="bmi-height" placeholder="مثلاً: 175">
        </div>
        <button class="bmi-btn" onclick="calculateBMI()">BMI معلوم کریں</button>
        <div id="bmi-output" class="bmi-result"></div>
    </div>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.calculator-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function appendValue(type, val) {
            let display = document.getElementById(type + '-display');
            if (display.value === '0' || display.value === 'خلاف ضابطہ' || display.value === 'نتیجہ غلط') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearDisplay(type) {
            document.getElementById(type + '-display').value = '0';
        }

        function calculate(type) {
            let display = document.getElementById(type + '-display');
            try {
                let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                display.value = eval(expression);
            } catch (error) {
                display.value = 'نتیجہ غلط';
            }
        }

        function sciFunc(funcName) {
            let display = document.getElementById('scientific-display');
            try {
                let val = parseFloat(display.value);
                if (isNaN(val)) val = 0;
                
                if (funcName === 'Math.sqrt') display.value = Math.sqrt(val);
                else if (funcName === 'Math.sin') display.value = Math.sin(val);
                else if (funcName === 'Math.cos') display.value = Math.cos(val);
                else if (funcName === 'Math.tan') display.value = Math.tan(val);
                else if (funcName === 'Math.log') display.value = Math.log10(val);
            } catch (error) {
                display.value = 'نتیجہ غلط';
            }
        }

        function calculateBMI() {
            let weight = parseFloat(document.getElementById('bmi-weight').value);
            let heightCm = parseFloat(document.getElementById('bmi-height').value);
            let output = document.getElementById('bmi-output');

            if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
                output.innerText = 'براہ کرم درست وزن اور قد درج کریں!';
                return;
            }

            let heightM = heightCm / 100;
            let bmi = (weight / (heightM * heightM)).toFixed(1);
            let status = '';

            if (bmi < 18.5) {
                status = 'کم وزن (Underweight)';
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                status = 'صحت مند وزن (Normal)';
            } else if (bmi >= 25 && bmi <= 29.9) {
                status = 'زیادہ وزن (Overweight)';
            } else {
                status = 'موٹاپا (Obese)';
            }

            output.innerHTML = `آپ کا BMI: ${bmi} <br> کیفیت: ${status}`;
        }
    </script>
</body>
</html>
